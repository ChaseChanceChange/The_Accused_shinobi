<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Accused — Shadow-Shinobi</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070a10'/%3E%3Cpath d='M32 7 49 18 45 45 32 57 19 45 15 18Z' fill='%2318202d' stroke='%23c6a15b' stroke-width='3'/%3E%3Cpath d='m22 21 10-7 10 7-7 11 8 13-11 7-11-7 8-13Z' fill='%235b456f' stroke='%23b8d5dc' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23f0b85c'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <script src="./vendor/protobuf/protobuf.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/build/three.module.js",
                "three/addons/": "./vendor/three/examples/jsm/"

            }
        }
    </script>
</head>
<body>
    <div id="browser-warning">
        <span class="browser-warning__text">⚠️ For the best experience, please use Google Chrome, Microsoft Edge, or Firefox.</span>
        <button id="btn-close-browser-warning" class="close-btn" type="button" aria-label="Dismiss browser warning">×</button>
    </div>
    <script>
        (function() {
            const ua = navigator.userAgent;
            // Check for Chrome (Desktop/Android), CriOS (iOS Chrome), Edg (Edge), or Firefox
            const isSupported = /Chrome/.test(ua) || /CriOS/.test(ua) || /Edg/.test(ua) || /Firefox/.test(ua);
            
            if (!isSupported) {
                const warning = document.getElementById('browser-warning');
                if (warning) warning.style.display = 'block';
            }
        })();
    </script>
    <div id="debug-console"></div>
    <div id="perf-overlay"></div>
    <!-- Shared CSS layout reservation; never an input surface or world clip. -->
    <div id="phone-encounter-region" aria-hidden="true"></div>
    <div id="ui-layer">

        <div id="game-timer">00:00</div>
        <!-- Connection state indicator: shown only during reconnect / lost -->
        <div id="conn-indicator" aria-live="polite"></div>
        <!-- Mobile UI Overlay -->
        <div id="mobile-ui">
            <div id="joystick-zone">
                <div id="joystick-knob"></div>
            </div>
            
            <div id="mobile-actions">
                <button id="btn-mobile-attack" class="mobile-btn" type="button" aria-label="Attack">Attack</button>
                <button id="btn-mobile-ability" class="mobile-btn" type="button" aria-label="Use primary ability">Skill</button>
                <button id="btn-mobile-interact" class="mobile-btn" type="button" aria-label="Interact or pick up loot">Use</button>
            </div>

            <div id="mobile-top-right">
                <button id="btn-mobile-inv" class="mobile-btn mobile-icon-btn" type="button" aria-label="Inventory">Bag</button>
                <button id="btn-mobile-char" class="mobile-btn mobile-icon-btn" type="button" aria-label="Character">Hero</button>
                <button id="btn-mobile-social" class="mobile-btn mobile-icon-btn" type="button">Social</button>
                <button id="btn-mobile-map" class="mobile-btn mobile-icon-btn" type="button">Map</button>
                <button id="btn-mobile-quest" class="mobile-btn mobile-icon-btn" type="button">Quests</button>
                <button id="btn-mobile-menu" class="mobile-btn mobile-icon-btn" type="button">Menu</button>
            </div>
        </div>

        <!-- Player HUD -->
        <div id="player-hud" style="display: none;">
            <div class="bar-container">
                <div id="player-hp-bar" class="bar-fill health-fill"></div>
                <div id="player-hp-text" class="bar-text">100 / 100</div>
            </div>
            <div class="bar-container">
                <div id="player-mana-bar" class="bar-fill mana-fill"></div>
                <div id="player-mana-text" class="bar-text">50 / 50</div>
            </div>
        </div>
            
        <!-- Ability Icon -->
        <div id="ability-container" style="display: none;">
            <div id="ability-icon"></div>
            <div id="ability-cooldown"></div>
            <div id="ability-tooltip">
                <h4 id="ability-name" class="ability-tooltip__name">Ability</h4>
                <div id="ability-desc" class="ability-tooltip__desc">Description</div>
                <div id="ability-cost" class="ability-tooltip__cost">Mana: 0</div>
            </div>
        </div>

        <!-- Hotbar -->
        <div id="hotbar-container">
            <div class="hotbar-slot" data-slot="0">
                <div class="hotbar-key">1</div>
                <div class="hotbar-icon"></div>
            </div>
            <div class="hotbar-slot" data-slot="1">
                <div class="hotbar-key">2</div>
                <div class="hotbar-icon"></div>
            </div>
            <div class="hotbar-slot" data-slot="2">
                <div class="hotbar-key">3</div>
                <div class="hotbar-icon"></div>
            </div>
            <div class="hotbar-slot" data-slot="3">
                <div class="hotbar-key">4</div>
                <div class="hotbar-icon"></div>
            </div>
        </div>

        <!-- Abilities Menu (Spellbook) -->
        <div id="abilities-menu" class="window abilities-menu content-aware-window" style="display: none;">
            <div class="window-header"><span>ABILITIES (P)</span><button id="btn-close-abilities" class="close-btn" type="button" aria-label="Close abilities menu">×</button></div>
            <div id="abilities-content" class="abilities-content">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Skill Tree Window -->
